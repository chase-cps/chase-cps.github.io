# The website: the handbook (MkDocs, handbook/) built and published on
# GitHub Pages at each push to master, with the API reference (api/, made by
# pdoc from the docstrings of chase-cps) under /api/.
name: Pages

# Run by hand until the Pages of the repository are set to GitHub Actions;
# then add "push: branches: [master]", and new/ becomes a redirect to the root.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs==1.6.1 pymdown-extensions==10.21.3
      - run: mkdocs build --strict -f handbook/mkdocs.yml -d "$GITHUB_WORKSPACE/_site"
      - run: cp -R api _site/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
