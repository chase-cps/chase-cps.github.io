site_name: CHASE
site_description: Contract-based Heterogeneous Analysis and Systems Exploration
site_url: https://chase-cps.github.io/
repo_url: https://github.com/chase-cps/chase
repo_name: chase-cps/chase
edit_uri: ""

# The theme follows the style of the CHASE site (GitHub Pages "slate").
theme:
  name: null
  custom_dir: theme

plugins:
  - search

extra:
  version: "0.4.2"
  pypi: https://pypi.org/project/chase-cps/
  # sections of the sidebar that stay open
  nav_open: ["Contract theory"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

nav:
  - Overview: index.md
  - News: news.md
  - Getting started: getting-started.md
  - Contract theory:
      - contracts/index.md
      - Formulas: contracts/formulas.md
      - Contract algebra: contracts/algebra.md
      - Contract-based verification: contracts/checks.md
  - Interfaces:
      - interfaces/index.md
      - Python package: interfaces/python.md
      - Command line: interfaces/command-line.md
      - Specification language and console: interfaces/logics-tool.md
      - MCP server for AI agents: interfaces/mcp.md
  - Tool integrations:
      - tools/index.md
      - Model checking: tools/model-checking.md
      - GR(1) synthesis: tools/synthesis.md
      - "Hardware: SVA and RTL": tools/systemverilog.md
  - Demos:
      - demos/index.md
      - AI agents: demos/ai-agents.md
      - "Aircraft (Lift-Plus-Cruise)": demos/lift-plus-cruise.md
      - Bus arbiter (AMBA AHB): demos/ahb.md
      - Circuit buffer swap: demos/buffer-swap.md
      - Warehouse robot: demos/warehouse-robot.md
      - Charging station (Charger): demos/charger.md
      - Autopilot (Lockheed Martin): demos/lm-fsm.md
      - Robotic joints: demos/robotic-joints.md
      - Power systems and factories: demos/power-systems.md
  - Contributing: contributing.md
  - Publications: publications.md
