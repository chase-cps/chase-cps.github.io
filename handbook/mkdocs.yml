site_name: CHASE
site_description: Contract-based Heterogeneous Analysis and Systems Exploration
site_url: https://chase-cps.github.io/
repo_url: https://github.com/chase-cps/chase
repo_name: chase-cps/chase
edit_uri: ""

# The theme follows the style of the CHASE site (GitHub Pages "slate").
theme:
  name: null
  custom_dir: theme

plugins:
  - search

extra:
  version: "0.6.1"
  pypi: https://pypi.org/project/chase-cps/
  # sections of the sidebar that stay open
  nav_open: ["Contract theory"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

nav:
  - Overview: index.md
  - News: news.md
  - Getting started: getting-started.md
  - Contract theory:
      - contracts/index.md
      - Formulas: contracts/formulas.md
      - Contract algebra: contracts/algebra.md
      - Contract-based verification: contracts/checks.md
      - Repair: contracts/repair.md
  - Interfaces:
      - interfaces/index.md
      - Inputs and outputs: interfaces/inputs-outputs.md
      - Python package: interfaces/python.md
      - Command line: interfaces/command-line.md
      - Specification language and console: interfaces/logics-tool.md
      - MCP server for AI agents: interfaces/mcp.md
      - Diagrams: interfaces/diagrams.md
  - Tool integrations:
      - tools/index.md
      - Model checking: tools/model-checking.md
      - GR(1) synthesis: tools/synthesis.md
      - "Hardware: SVA and RTL": tools/systemverilog.md
      - C programs: tools/c-programs.md
  - Demos:
      - demos/index.md
      - Running the demos: demos/running.md
      - AI agents:
          - Payment assistant agent: demos/payment-assistant.md
      - Aircraft and vehicles:
          - NASA Lift-Plus-Cruise aircraft: demos/lift-plus-cruise.md
          - Lockheed Martin autopilot: demos/lm-fsm.md
          - Emergency braking: demos/braking.md
          - Aircraft power system: demos/aircraft-power.md
      - Hardware:
          - OpenTitan security chip: demos/escalation.md
          - Circuit buffer swap: demos/buffer-swap.md
          - AMBA AHB bus arbiter: demos/ahb.md
          - Resource arbiter: demos/deadline.md
      - Software:
          - Contracts in C: demos/contracts-in-c.md
          - Fire-suppression drones in C: demos/drone-grid.md
      - Drones and robots:
          - Drone climb: demos/drone-altitude.md
          - Warehouse robot: demos/warehouse-robot.md
          - Robot charging station: demos/charger.md
          - Robotic arm joints: demos/robotic-joints.md
          - Pick-and-place arm: demos/pick-and-place.md
          - Drone timing: demos/drone-timing.md
      - Buildings and factories:
          - Room thermostat: demos/heater.md
          - Factory gate controller: demos/factory-gates.md
  - Contributing: contributing.md
  - Publications: publications.md
